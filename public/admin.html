<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Log Pengakses</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #fff;
            --text: #1d1d1f;
            --border: #d2d2d7;
            --accent: #007aff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --border: #38383a;
            }
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 { font-size: 1.5rem; margin: 0; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { opacity: 0.9; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            background: rgba(0,0,0,0.02);
            font-weight: 600;
            color: var(--text);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(0,122,255,0.05); }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-gps { background: #34c75922; color: #34c759; }
        .badge-ip { background: #ff950022; color: #ff9500; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Log Pengakses Perangkat</h1>
        <div>
            <button class="btn" onclick="fetchLogs()">Refresh</button>
            <a href="/api/export" class="btn" style="background: #34c759;">Export CSV</a>
        </div>
    </header>

    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Device & OS</th>
                        <th>Browser</th>
                        <th>IP & ISP</th>
                        <th>Lokasi</th>
                        <th>Sumber</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr>
                        <td colspan="6" style="text-align:center; padding:40px;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const logs = await res.json();
            const body = document.getElementById('log-body');
            
            if (logs.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">Belum ada data pengakses.</td></tr>';
                return;
            }

            body.innerHTML = logs.reverse().map(l => {
                const date = new Date(l.receivedAt).toLocaleString('id-ID');
                const device = `${l.deviceVendor} ${l.deviceModel}`.trim() || 'Desktop';
                const os = `${l.osName} ${l.osVersion}`;
                const location = l.geo ? `${l.geo.city}, ${l.geo.region}` : 'Unknown';
                const sourceBadge = l.geo?.source === 'gps' ? '<span class="badge badge-gps">GPS</span>' : '<span class="badge badge-ip">IP</span>';

                return `
                    <tr>
                        <td>${date}</td>
                        <td>
                            <strong>${device}</strong><br>
                            <small style="color:#888">${os}</small>
                        </td>
                        <td>${l.browserName} <small>${l.browserVersion.split('.')[0]}</small></td>
                        <td>
                            ${l.ip}<br>
                            <small style="color:#888">${l.isp || '-'}</small>
                        </td>
                        <td>${location}</td>
                        <td>${sourceBadge}</td>
                    </tr>
                `;
            }).join('');
        } catch (e) {
            console.error(e);
        }
    }

    // Initial fetch
    fetchLogs();
    // Auto refresh every 30s
    setInterval(fetchLogs, 30000);
</script>

</body>
</html>
